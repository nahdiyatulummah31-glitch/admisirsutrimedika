<!doctype html>
<html lang="id">
<head>
  <base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{--navy:#12304a;--blue:#176b87;--teal:#149b91;--bg:#f2f6f9;--line:#d8e3e9;--ink:#183246;--muted:#687f8e}
    *{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);font:15px/1.5 Arial,sans-serif;color:var(--ink)}
    header{background:linear-gradient(120deg,#12304a,#176b87);color:white;padding:23px max(18px,calc((100% - 1200px)/2))}header .eyebrow{font-size:12px;letter-spacing:.13em;font-weight:700;color:#bfe8ed}header h1{font-size:25px;margin:2px 0 3px}header p{margin:0;color:#d8edf4}
    main{max-width:1200px;margin:22px auto;padding:0 18px 42px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{border:1px solid var(--line);border-radius:9px;background:white;color:var(--navy);padding:10px 15px;font-weight:700;cursor:pointer}.tab.active{background:var(--navy);color:white;border-color:var(--navy)}
    .panel{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 8px 26px #18324610}.panel h2{font-size:19px;color:var(--navy);margin:0 0 14px}.layout{display:grid;grid-template-columns:minmax(290px,370px) 1fr;gap:16px;align-items:start}.form{display:grid;gap:11px}.form-grid{display:grid;gap:11px}label{font-size:13px;font-weight:700;color:#315166;display:block;margin-bottom:4px}input,select,textarea{width:100%;font:inherit;padding:10px 11px;border:1px solid #cbd9e2;border-radius:8px;background:#fff;color:var(--ink)}textarea{min-height:72px;resize:vertical}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .primary,.secondary,.danger{font:inherit;cursor:pointer;border-radius:8px;padding:9px 12px}.primary{background:var(--teal);border:0;color:white;font-weight:700}.secondary{background:white;border:1px solid var(--line);color:var(--navy)}.danger{background:white;border:1px solid #f1cdca;color:#a52b22}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.notice{padding:10px 12px;border-radius:8px;margin-bottom:14px;display:none}.notice.ok{display:block;background:#e9f8f3;color:#17624f}.notice.err{display:block;background:#fff0ef;color:#9d271f}
    .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toolbar input{max-width:260px}.toolbar .admin-date{margin:0;min-width:160px;font-size:12px}.toolbar .admin-date input{display:block;max-width:170px;padding:7px 8px}.list-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.count{font-size:13px;color:var(--muted)}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:9px}table{border-collapse:collapse;width:100%;min-width:850px;font-size:13px}th,td{text-align:left;padding:10px 9px;border-bottom:1px solid #e8eef2;vertical-align:top}th{background:#f4f8fa;color:#34546a;white-space:nowrap}tr:last-child td{border-bottom:0}.empty{text-align:center;color:var(--muted);padding:24px}
    .dash-title{margin:0 0 13px;color:var(--navy);font-size:20px}.dash-tools{display:flex;gap:10px;align-items:end;margin-bottom:16px}.dash-tools label{min-width:245px}.dash-table{min-width:780px}.dashboard-total{font-size:13px;color:var(--muted);margin:0 0 10px}
    @media(max-width:850px){.layout{grid-template-columns:1fr}header h1{font-size:21px}}@media(max-width:520px){.row2{grid-template-columns:1fr}.dash-tools{display:block}.dash-tools label{display:block;margin-bottom:8px}.panel{padding:14px}}
  </style>
</head>
<body>
<header><div class="eyebrow">RUMAH SAKIT UMUM</div><h1>Rumah Sakit Umum Trimedika Ketapang</h1><p>Pendaftaran / Admisi · Kendali Rawat Jalan · Kendali Rawat Inap</p></header>
<main>
  <div id="notice" class="notice"></div>
  <nav class="tabs">
    <button class="tab active" data-page="admin">Pendaftaran / Admisi</button>
    <button class="tab" data-page="rj">Dashboard Rawat Jalan</button>
    <button class="tab" data-page="ri">Dashboard Rawat Inap</button>
  </nav>

  <section id="adminPage" class="layout">
    <div class="panel"><h2 id="formTitle">Input Rencana Pasien</h2>
      <form id="form" class="form">
        <div><label for="jenisLayanan">Jenis rencana *</label><select id="jenisLayanan" required><option value="">Pilih Rawat Jalan atau Rawat Inap</option><option>Rawat Jalan</option><option>Rawat Inap</option></select></div>
        <div id="poliWrap"><label for="poliTujuan">Poli tujuan (Rawat Jalan) *</label><select id="poliTujuan"><option value="">Pilih poli</option><option>Poli Penyakit Dalam</option><option>Poli Bedah Umum</option><option>Poli Bedah Mulut</option><option>Poli Obgyn/ Kebidanan</option><option>Poli Anak</option><option>Poli Paru</option><option>Poli Saraf/ Neuro</option></select></div>
        <div id="dokterWrap"><label for="dokter">Dokter tujuan *</label><select id="dokter"><option value="">Pilih dokter</option><option>dr. Sisilia Dewanti, Sp.PD</option><option>dr. Jo Jonathan Jose Johan, Sp.PD</option><option>dr. Eldaa Putik Bunga Melati, Sp.P</option><option>dr. Deddy Setiawan Widjaja, Sp.B</option><option>dr. Kartika Istiningtyas, Sp.A</option><option>dr. Adia Triyarintana, Sp.OG</option><option>dr. Arif Eko Wibowo, Sp.N</option><option>drg. Aris Setyawan, MPH, M.Ked.Klin Sp.BMM TM-TMJ (K) SH</option></select></div>
        <div id="kelasWrap"><label for="kelasRawat">Kelas rawat inap *</label><select id="kelasRawat"><option value="">Pilih kelas</option><option>VIP</option><option>Kelas 1</option><option>Kelas 2</option><option>Kelas 3</option></select></div>
        <div id="bangsalWrap"><label for="bangsalRawat">Bangsal rawat inap *</label><select id="bangsalRawat"><option value="">Pilih bangsal</option><option>Cemara</option><option>Cendana</option><option>Gaharu</option><option>HCU</option><option>Isolasi</option><option>ICU</option></select></div>
        <div><label for="namaPasien">Nama pasien *</label><input id="namaPasien" required maxlength="120"></div>
        <div><label for="noRekamMedis">No. rekam medis *</label><input id="noRekamMedis" required maxlength="50" autocomplete="off"></div>
        <div><label for="asuransi">Asuransi pembiayaan *</label><select id="asuransi" required><option value="">Pilih penjamin</option><option>BPJS Kesehatan</option><option>Umum</option><option>Asuransi Lain</option></select></div>
        <div id="otherWrap" hidden><label for="namaAsuransiLain">Nama asuransi lain *</label><input id="namaAsuransiLain" maxlength="100"></div>
        <div><label for="noHp">No. HP pasien *</label><input id="noHp" type="text" inputmode="tel" required maxlength="30" placeholder="Contoh: 081234567890" autocomplete="tel"></div>
        <div><label id="dateLabel" for="tanggal">Tanggal rencana *</label><input id="tanggal" type="date" required></div>
        <div><label for="diagnosis">Diagnosis *</label><textarea id="diagnosis" required maxlength="500"></textarea></div>
        <div><label for="catatan">Catatan</label><textarea id="catatan" maxlength="1000" placeholder="Keterangan tambahan"></textarea></div>
        <div class="actions"><button class="primary" id="saveBtn" type="submit">Simpan Rencana</button><button class="secondary" id="cancelBtn" type="button" hidden onclick="cancelEdit()">Batal Edit</button></div>
      </form>
    </div>
    <div class="panel"><div class="list-head"><h2>Daftar Rencana Terdaftar</h2><span class="count" id="adminCount"></span></div>
      <div class="toolbar"><label class="admin-date" for="adminInputDate">Tanggal input<input id="adminInputDate" type="date"></label><input id="search" placeholder="Cari pasien, RM, HP, diagnosis"><select id="filterService"><option value="">Semua rencana</option><option>Rawat Jalan</option><option>Rawat Inap</option></select><button class="secondary" type="button" onclick="loadAdminData()">Muat ulang</button></div>
      <div class="table-wrap"><table><thead><tr><th>Layanan</th><th>Tgl. Rencana</th><th>Tanggal Input</th><th>No. RM</th><th>Nama Pasien</th><th>Poli (RJ)</th><th>Dokter</th><th>Kelas Rawat</th><th>Bangsal</th><th>Asuransi</th><th>No. HP</th><th>Diagnosis</th><th>Catatan</th><th>Aksi</th></tr></thead><tbody id="adminRows"></tbody></table></div>
    </div>
  </section>

  <section id="dashboardPage" class="panel" hidden>
    <h2 id="dashboardTitle" class="dash-title"></h2>
    <div class="dash-tools"><label id="dashboardDateLabel" for="dashboardDate">Tanggal rencana<input id="dashboardDate" type="date"></label></div>
    <p class="dashboard-total" id="dashboardTotal"></p>
    <div class="table-wrap"><table class="dash-table"><thead id="dashHead"></thead><tbody id="dashRows"></tbody></table></div>
  </section>
</main>
<script>
  let page='admin', records=[], editingId='';
  const $=id=>document.getElementById(id);
  document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.page)));
  $('jenisLayanan').addEventListener('change',syncServiceFields);
  $('asuransi').addEventListener('change',()=>{const other=$('asuransi').value==='Asuransi Lain';$('otherWrap').hidden=!other;$('namaAsuransiLain').required=other;});
  $('dashboardDate').addEventListener('change',loadDashboard);
  $('adminInputDate').addEventListener('change',loadAdminData);
  $('search').addEventListener('input',renderAdmin);$('filterService').addEventListener('change',renderAdmin);
  $('form').addEventListener('submit',saveForm);

  function showPage(p){page=p;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.page===p));const isAdmin=p==='admin';$('adminPage').hidden=!isAdmin;$('dashboardPage').hidden=isAdmin;if(isAdmin){loadAdminData();return;}const unit=p==='rj'?'Rawat Jalan':'Rawat Inap';$('dashboardTitle').textContent='Dashboard '+unit;$('dashboardDateLabel').firstChild.textContent=p==='rj'?'Tanggal rencana kontrol':'Tanggal rencana rawat inap';const cols=p==='rj'?['No.','Nama Pasien','No. RM','No. HP','Diagnosis','Poli Tujuan','Dokter','Asuransi Pembiayaan','Catatan']:['Nama Pasien','No. RM','No. HP','Diagnosis','Dokter','Asuransi Pembiayaan','Catatan','Bangsal','Kelas Rawat Inap'];$('dashHead').innerHTML='<tr>'+cols.map(x=>`<th>${esc(x)}</th>`).join('')+'</tr>';loadDashboard();}
  function syncServiceFields(){const selected=$('jenisLayanan').value;const rj=selected==='Rawat Jalan',ri=selected==='Rawat Inap';$('poliWrap').hidden=!rj;$('dokterWrap').hidden=!(rj||ri);$('kelasWrap').hidden=!ri;$('bangsalWrap').hidden=!ri;$('poliTujuan').required=rj;$('dokter').required=rj||ri;$('kelasRawat').required=ri;$('bangsalRawat').required=ri;$('dateLabel').textContent=rj?'Tanggal rencana kontrol *':'Tanggal rencana rawat inap *';}
  function loadAdminData(){const date=$('adminInputDate').value||localToday();google.script.run.withSuccessHandler(r=>{records=r.registrations||[];renderAdmin();}).withFailureHandler(err=>notify(err.message||'Gagal mengambil data.',true)).getAppData(date);}
  function loadDashboard(){if(page==='admin')return;const unit=page==='rj'?'Rawat Jalan':'Rawat Inap';if(!$('dashboardDate').value)$('dashboardDate').value=localToday();google.script.run.withSuccessHandler(showDashboard).withFailureHandler(err=>notify(err.message||'Gagal memuat dashboard.',true)).getDashboardData(unit,$('dashboardDate').value);}
  function showDashboard(r){const missingBangsal=r.unit==='Rawat Inap'?r.rows.filter(x=>!String(x.bangsal||'').trim()).length:0;$('dashboardTotal').textContent=`${r.total} pasien terdaftar untuk ${r.unit} pada ${formatDate(r.date)}.${missingBangsal?` ${missingBangsal} pasien belum memiliki bangsal; lengkapi melalui Edit di Pendaftaran/Admisi.`:''}`;if(!r.rows.length){$('dashRows').innerHTML=`<tr><td class="empty" colspan="9">Belum ada rencana terdaftar untuk tanggal ini.</td></tr>`;return;}const keys=r.unit==='Rawat Jalan'?['no','nama','noRekamMedis','noHp','diagnosis','poli','dokter','asuransi','catatan']:['nama','noRekamMedis','noHp','diagnosis','dokter','asuransi','catatan','bangsal','kelas'];$('dashRows').innerHTML=r.rows.map((x,i)=>'<tr>'+keys.map(k=>`<td>${k==='no'?i+1:esc(x[k]||(r.unit==='Rawat Inap'&&k==='bangsal'?'Belum dipilih':'—'))}</td>`).join('')+'</tr>').join('');}
  function renderAdmin(){const q=$('search').value.toLowerCase(),filter=$('filterService').value,inputDate=$('adminInputDate').value||localToday();const rows=records.filter(r=>inputDay(r['Waktu Input'])===inputDate&&(!filter||r['Jenis Layanan']===filter)&&['Jenis Layanan','Tanggal Rencana','No. Rekam Medis','Nama Pasien','Poli Tujuan','Dokter','Kelas Rawat Inap','Bangsal Rawat Inap','Asuransi Pembiayaan','Status Asuransi','No. HP','Diagnosis','Catatan','Keterangan'].some(k=>(r[k]||'').toLowerCase().includes(q)));$('adminCount').textContent=`${rows.length} rencana · input ${formatDate(inputDate)}`;if(!rows.length){$('adminRows').innerHTML='<tr><td class="empty" colspan="14">Belum ada rencana yang diinput pada tanggal ini.</td></tr>';return;}$('adminRows').innerHTML=rows.map(r=>`<tr><td>${esc(r['Jenis Layanan']||'—')}</td><td>${esc(formatDate(r['Tanggal Rencana']||r['Tanggal Kontrol']||r['Tanggal Rencana Rawat Inap']))}</td><td>${esc(formatDate(inputDay(r['Waktu Input'])))}</td><td>${esc(r['No. Rekam Medis']||'—')}</td><td>${esc(r['Nama Pasien']||'—')}</td><td>${esc(r['Jenis Layanan']==='Rawat Jalan'?(r['Poli Tujuan']||'—'):'—')}</td><td>${esc(r['Dokter']||'—')}</td><td>${esc(r['Kelas Rawat Inap']||'—')}</td><td>${esc(r['Jenis Layanan']==='Rawat Inap'?(r['Bangsal Rawat Inap']||'Belum diisi'):'—')}</td><td>${esc(r['Asuransi Pembiayaan']||r['Status Asuransi']||'—')}${r['Nama Asuransi Lain']?' · '+esc(r['Nama Asuransi Lain']):''}</td><td>${esc(formatPhone(r['No. HP']))}</td><td>${esc(r['Diagnosis']||'—')}</td><td>${esc(r['Catatan']||r['Keterangan']||'—')}</td><td><div class="actions"><button class="secondary" onclick="editRecord('${escAttr(r['ID Pendaftaran'])}')">Edit</button><button class="danger" onclick="deleteRecord('${escAttr(r['ID Pendaftaran'])}')">Hapus</button></div></td></tr>`).join('');}
  function saveForm(e){e.preventDefault();const d={editId:editingId,jenisLayanan:$('jenisLayanan').value,noRekamMedis:$('noRekamMedis').value,namaPasien:$('namaPasien').value,poliTujuan:$('poliTujuan').value,dokter:$('dokter').value,kelasRawat:$('kelasRawat').value,bangsalRawat:$('bangsalRawat').value,asuransi:$('asuransi').value,namaAsuransiLain:$('namaAsuransiLain').value,noHp:$('noHp').value,tanggal:$('tanggal').value,diagnosis:$('diagnosis').value,catatan:$('catatan').value};$('saveBtn').disabled=true;$('saveBtn').textContent='Menyimpan…';google.script.run.withSuccessHandler(r=>{const wasEditing=Boolean(editingId);notify(r.message);$('form').reset();editingId='';$('cancelBtn').hidden=true;$('formTitle').textContent='Input Rencana Pasien';$('saveBtn').disabled=false;$('saveBtn').textContent='Simpan Rencana';syncServiceFields();$('otherWrap').hidden=true;$('namaAsuransiLain').required=false;if(!wasEditing)$('adminInputDate').value=localToday();loadAdminData();}).withFailureHandler(err=>{notify(err.message||'Gagal menyimpan rencana.',true);$('saveBtn').disabled=false;$('saveBtn').textContent=editingId?'Simpan Perubahan':'Simpan Rencana';}).saveAdmisi(d);}
  function editRecord(id){const r=records.find(x=>x['ID Pendaftaran']===id);if(!r)return;editingId=id;$('jenisLayanan').value=r['Jenis Layanan']||((r['Poli Tujuan']||r['Tanggal Kontrol'])?'Rawat Jalan':'Rawat Inap');syncServiceFields();$('noRekamMedis').value=r['No. Rekam Medis']||'';$('namaPasien').value=r['Nama Pasien']||'';$('poliTujuan').value=r['Poli Tujuan']||'';$('dokter').value=r['Dokter']||'';$('kelasRawat').value=r['Kelas Rawat Inap']||'';$('bangsalRawat').value=r['Bangsal Rawat Inap']||'';$('asuransi').value=r['Asuransi Pembiayaan']||r['Status Asuransi']||'';$('namaAsuransiLain').value=r['Nama Asuransi Lain']||'';$('otherWrap').hidden=$('asuransi').value!=='Asuransi Lain';$('namaAsuransiLain').required=$('asuransi').value==='Asuransi Lain';$('noHp').value=formatPhone(r['No. HP']);$('tanggal').value=toInputDate(r['Tanggal Rencana']||r['Tanggal Kontrol']||r['Tanggal Rencana Rawat Inap']);$('diagnosis').value=r['Diagnosis']||'';$('catatan').value=r['Catatan']||r['Keterangan']||'';$('formTitle').textContent='Edit Rencana Pasien';$('saveBtn').textContent='Simpan Perubahan';$('cancelBtn').hidden=false;window.scrollTo({top:0,behavior:'smooth'});}
  function cancelEdit(){$('form').reset();editingId='';$('cancelBtn').hidden=true;$('formTitle').textContent='Input Rencana Pasien';$('saveBtn').textContent='Simpan Rencana';$('otherWrap').hidden=true;$('namaAsuransiLain').required=false;syncServiceFields();}
  function deleteRecord(id){if(!confirm('Hapus rencana pasien ini?'))return;google.script.run.withSuccessHandler(()=>{notify('Rencana dihapus.');loadAdminData();}).withFailureHandler(err=>notify(err.message||'Gagal menghapus data.',true)).deleteAdmisi(id);}
  function localToday(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const o={};p.forEach(x=>o[x.type]=x.value);return `${o.year}-${o.month}-${o.day}`;}
  function toInputDate(v){const s=String(v||'');if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);return m?`${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`:'';}
  function formatDate(v){const d=toInputDate(v);if(!d)return v||'—';const [y,m,day]=d.split('-');return `${day}/${m}/${y}`;}
  function inputDay(v){const s=String(v||'').trim(),m=s.match(/^(\d{4}-\d{2}-\d{2})/);return m?m[1]:toInputDate(s);}
  function formatPhone(v){let s=String(v==null?'':v).trim();if(/^\d{9,14}$/.test(s)&&s[0]!=='0'&&!s.startsWith('62'))s='0'+s;return s;}
  function notify(s,error=false){const n=$('notice');n.textContent=s;n.className='notice '+(error?'err':'ok');setTimeout(()=>n.className='notice',4500);}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function escAttr(s){return esc(s);}
  $('adminInputDate').value=localToday();syncServiceFields();loadAdminData();
</script>
</body>
</html>
